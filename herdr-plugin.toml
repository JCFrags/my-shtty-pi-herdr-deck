id = "pi.herdr.orchestrator"
name = "Pi Herd Orchestrator"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Herdr-native multi-agent control plane for Pi coding agents"
platforms = ["linux"]

[[build]]
command = ["npm", "run", "build"]
platforms = ["linux"]

[[startup]]
command = ["./bin/pi-herdr-orchestrator", "broker", "startup"]
platforms = ["linux"]

[[panes]]
id = "deck"
title = "Pi Herd"
placement = "split"
command = ["./bin/pi-herdr-orchestrator", "deck"]
