id = "pi.herdr.orchestrator"
name = "Agent Board"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Agent Board control plane and mouse-first side TUI for Pi coding agents"
platforms = ["linux"]

[[build]]
command = ["npm", "run", "build"]
platforms = ["linux"]

[[startup]]
command = ["./bin/pi-herdr-orchestrator", "broker", "startup"]
platforms = ["linux"]

[[panes]]
id = "deck"
title = "Agent Board"
placement = "split"
command = ["./bin/pi-herdr-orchestrator", "deck"]
